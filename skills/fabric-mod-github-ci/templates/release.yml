name: Release

# Al subir un tag vX.Y.Z: compila y prueba cada versión de Minecraft y crea una release de GitHub con los jars.
# Modrinth y CurseForge son opcionales: se publican solo si existen en el repositorio
#   vars.MODRINTH_ID + secrets.MODRINTH_TOKEN   y/o   vars.CURSEFORGE_ID + secrets.CURSEFORGE_TOKEN

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - minecraft: "26.1.2"
            game-versions: |
              26.1
              26.1.1
              26.1.2
          - minecraft: "26.2"
            game-versions: |
              26.2
          - minecraft: "26.3"
            game-versions: |
              26.3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew :${{ matrix.minecraft }}:build :${{ matrix.minecraft }}:runGameTest --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: __MOD_ID__-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish to Modrinth / CurseForge
        if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
          name: __MOD_NAME__ ${{ github.ref_name }} for MC ${{ matrix.minecraft }}
          version: ${{ github.ref_name }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          java: 25
          dependencies: |
            __MC_PUBLISH_DEPENDENCIES__

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: __MOD_ID__-mc*
          path: jars
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" jars/*.jar \
            --title "__MOD_NAME__ $GITHUB_REF_NAME" \
            --notes "Un jar por versión de Minecraft (26.1.x, 26.2.x, 26.3.x). Requiere Fabric Loader y Fabric API, en cliente y servidor. Cambios: ver CHANGELOG.md." \
            --verify-tag
